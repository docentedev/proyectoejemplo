spring.application.name=proyectoejemplo

# Cambiar el puerto interno del contenedor al estándar de Spring
server.port=${PORT:8080}

# Host dinámico inyectado desde el pipeline
app.public-host=${PUBLIC_HOST_URL:http://localhost:8080}

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-2.amazonaws.com/us-east-2_ZhTULhf5B
app.gateway.secret=${API_GATEWAY_SECRET:secreto_local}

# --- Base de datos (DynamoDB) ---
# Sin credenciales estáticas: se usa el IAM Role de la instancia EC2 (EC2-DynamoDB-Access-Role).
# La región la resuelve el SDK de AWS automáticamente desde la variable de entorno AWS_REGION.
app.dynamo.table-name=${DYNAMO_TABLE_NAME:Products}