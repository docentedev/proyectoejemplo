plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.docente'
version = '0.0.1-SNAPSHOT'
description = 'proyectoejemplo'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

ext {
    awssdkVersion = '2.29.52'
}

dependencyManagement {
    imports {
        mavenBom "software.amazon.awssdk:bom:${awssdkVersion}"
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 1. OBLIGATORIO: Spring Security (para gestionar filtros y autorizaciones)
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // 2. OBLIGATORIO SI USAS JWT: Soporte para validar tokens de autorización (OAuth2 Resource Server)
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // 3. Persistencia: DynamoDB (credenciales vía IAM Role de la instancia EC2, sin llaves estáticas)
    implementation 'software.amazon.awssdk:dynamodb-enhanced'
    implementation 'software.amazon.awssdk:dynamodb'
}

tasks.named('test') {
    useJUnitPlatform()
}
