name: Deploy Spring Boot to EC2 via GHCR

on:
  push:
    branches:
      - main  # Se ejecuta automáticamente al hacer push a la rama main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CONTAINER_NAME: spring-app-ejemplo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Permiso obligatorio para escribir en GitHub Packages

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Configurar JDK 21 y la caché automática para Gradle
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # 2. Dar permisos de ejecución al Gradle Wrapper y compilar el JAR
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew bootJar -x test

      # 3. Autenticarse en GitHub Container Registry (GHCR) usando las variables de GitHub
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Construir y subir la imagen Docker a GHCR con el tag 'latest'
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      # 5. Despliegue e Instalación Automatizada, Replicable e Idempotente vía SSH
      - name: Deploy to EC2 Instance
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.TARGET_HOST_IP }}  # IP desde Repository Variables
          username: ec2-user                 # Usuario para Amazon Linux
          key: ${{ secrets.EC2_SSH_KEY }}     # Llave desde Repository Secrets
          port: 22
          envs: TARGET_HOST_IP
          script: |
            # --- BLOQUE IDEMPOTENTE DE INSTALACIÓN (Provisionamiento automático) ---
            if ! command -v docker &> /dev/null; then
              echo "Docker no está instalado. Iniciando aprovisionamiento automático..."
              sudo dnf update -y
              sudo dnf install -y docker
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker ec2-user
              echo "Docker instalado con éxito. Reaplicando privilegios de grupo..."
              # Forzamos a que la sesión actual de bash reconozca el nuevo grupo de docker sin desloguearse
              exec sg docker "$0" "$@"
            fi
            
            # --- PROCESO ESTÁNDAR DE DESPLIEGUE ---
            # Autenticar el Docker local del EC2 en GHCR usando el Token Secreto
            echo "${{ secrets.GH_CR_PAT }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            
            # Descargar la última versión de la imagen recién subida
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            
            # --- PASOS IDEMPOTENTES DEL CONTENEDOR ---
            # Detiene el contenedor anterior si existe (el '|| true' evita fallos en la primera corrida)
            docker stop ${{ env.CONTAINER_NAME }} || true
            
            # Elimina el contenedor antiguo para poder liberar el nombre
            docker rm ${{ env.CONTAINER_NAME }} || true
            
            # Limpia imágenes huérfanas/antiguas para no colapsar el almacenamiento del disco en la capa gratuita
            docker image prune -f
            
            # --- LANZAMIENTO CON VARIABLE DE ENTORNO DINÁMICA DE HOST IP ---
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              -p 80:80 \
              -e PORT=80 \
              -e PUBLIC_HOST_URL="http://$TARGET_HOST_IP" \
              --restart unless-stopped \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        env:
          TARGET_HOST_IP: ${{ vars.TARGET_HOST_IP }}
