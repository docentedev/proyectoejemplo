name: Deploy Spring Boot to EC2 via GHCR

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CONTAINER_NAME: spring-app-ejemplo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew bootJar -x test

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to EC2 Instance
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.TARGET_HOST_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: TARGET_HOST_IP,API_GATEWAY_SECRET,GH_CR_PAT
          script: |
            if [ ! -f /swapfile ]; then
              echo "Instancia sin Swap. Creando 2GB..."
              sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            fi
            
            if ! command -v docker &> /dev/null; then
              echo "Docker no está instalado. Iniciando instalación..."
              sudo dnf update -y
              sudo dnf install -y docker
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker ec2-user
            fi
            
            sg docker -c "
              echo '$GH_CR_PAT' | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
              docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
              docker stop ${{ env.CONTAINER_NAME }} || true
              docker rm ${{ env.CONTAINER_NAME }} || true
              docker image prune -f
            
              docker run -d \
                --name ${{ env.CONTAINER_NAME }} \
                -p 80:8080 \
                -e PORT=8080 \
                -e PUBLIC_HOST_URL='http://$TARGET_HOST_IP' \
                -e API_GATEWAY_SECRET='$API_GATEWAY_SECRET' \
                --restart unless-stopped \
                ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            "
        env:
          TARGET_HOST_IP: ${{ vars.TARGET_HOST_IP }}
          API_GATEWAY_SECRET: ${{ secrets.API_GATEWAY_SECRET }}
          GH_CR_PAT: ${{ secrets.GH_CR_PAT }}